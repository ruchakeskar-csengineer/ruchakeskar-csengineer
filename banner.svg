<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Rucha Keskar. Computer vision, drones, robotics, and machine learning engineer.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#334155" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1000" height="300" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="1000" height="300" rx="22" fill="url(#grid)" opacity="0.35"/>
  <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="22" fill="none" stroke="url(#border)" stroke-width="2"/>

  <!-- Terminal header -->
  <circle cx="36" cy="26" r="6" fill="#F87171"/>
  <circle cx="56" cy="26" r="6" fill="#FBBF24"/>
  <circle cx="76" cy="26" r="6" fill="#34D399"/>
  <text x="500" y="31" text-anchor="middle" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="13" fill="#C4B5FD">rucha@profile:~$</text>

  <!-- Name -->
  <text x="48" y="118" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="46" font-weight="700" fill="url(#title)">Rucha Keskar</text>
  <text x="48" y="152" font-family="ui-monospace, Consolas, Menlo, monospace" font-size="18" fill="#67E8F9">Computer Vision · Drones · Robotics · Machine Learning</text>

  <!-- Colourful tags -->
  <g font-family="ui-monospace, Consolas, Menlo, monospace" font-size="13" font-weight="700">
    <rect x="48" y="176" width="78" height="28" rx="14" fill="#F472B6"/>
    <text x="87" y="195" text-anchor="middle" fill="#0F172A">YOLO</text>
    <rect x="136" y="176" width="92" height="28" rx="14" fill="#A78BFA"/>
    <text x="182" y="195" text-anchor="middle" fill="#0F172A">Vision</text>
    <rect x="238" y="176" width="92" height="28" rx="14" fill="#34D399"/>
    <text x="284" y="195" text-anchor="middle" fill="#0F172A">Drones</text>
    <rect x="340" y="176" width="102" height="28" rx="14" fill="#FBBF24"/>
    <text x="391" y="195" text-anchor="middle" fill="#0F172A">Robotics</text>
    <rect x="452" y="176" width="58" height="28" rx="14" fill="#60A5FA"/>
    <text x="481" y="195" text-anchor="middle" fill="#0F172A">ML</text>
  </g>

  <!-- Terminal lines -->
  <g font-family="ui-monospace, Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">
    <text x="48" y="234"><tspan fill="#34D399">$</tspan> <tspan fill="#FBBF24">focus</tspan> --areas "vision, sensors, drones, ml"</text>
    <text x="48" y="258"><tspan fill="#34D399">$</tspan> <tspan fill="#FBBF24">training</tspan> YOLO models on <tspan fill="#67E8F9">camera</tspan> and <tspan fill="#67E8F9">sensor</tspan> data<tspan fill="#F472B6">_</tspan></text>
  </g>

  <!-- Colourful signal bars -->
  <g fill="url(#bar)" opacity="0.9">
    <rect x="826" y="200" width="10" height="50" rx="3"/>
    <rect x="843" y="176" width="10" height="74" rx="3"/>
    <rect x="860" y="150" width="10" height="100" rx="3"/>
    <rect x="877" y="182" width="10" height="68" rx="3"/>
    <rect x="894" y="158" width="10" height="92" rx="3"/>
    <rect x="911" y="194" width="10" height="56" rx="3"/>
  </g>
</svg>
